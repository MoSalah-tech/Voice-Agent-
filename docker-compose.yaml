services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - voice-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # Override REDIS_URL to use the Docker service name
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - voice-net

  frontend:
    build:
      context: ./voice-agent-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ws://backend:8000/ws/voice   # internal Docker network URL
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - voice-net

volumes:
  redis_data:

networks:
  voice-net:
    driver: bridge