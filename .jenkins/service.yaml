apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  selector:
    app: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080   # optional: fixed NodePort
    - name: jnlp
      port: 50000
      targetPort: 50000
  type: NodePort